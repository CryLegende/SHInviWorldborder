name: SHInviWorldborder
version: '${project.version}'
main: org.Cry_Legende.sHInviWorldborder.SHInviWorldborder
api-version: '1.20'
author: Cry_Legende
description: Bordures invisibles des mondes et des îles, signalées par un mur de particules.
softdepend: [SuperiorSkyblock2]

commands:
  shinviworldborder:
    description: Administration de SHInviWorldborder.
    usage: /<command> <reload|info>

permissions:
  shinviworldborder.bypass:
    description: Traverser les bordures des mondes et des îles.
    default: false
  shinviworldborder.margin.vip:
    description: Marge d'île élargie du palier vip (islands.margins.vip). Un nœud par clé de islands.margins, par exemple shinviworldborder.margin.vipplus.
    default: op
  shinviworldborder.margin.vipplus:
    description: Marge d'île élargie du palier vipplus (islands.margins.vipplus).
    default: op
  shinviworldborder.margin.vipelite:
    description: Marge d'île élargie du palier vipelite (islands.margins.vipelite).
    default: op
  shinviworldborder.admin:
    description: Toutes les commandes d'administration de SHInviWorldborder.
    default: op
    children:
      shinviworldborder.admin.reload: true
      shinviworldborder.admin.info: true
  shinviworldborder.admin.reload:
    description: Recharger config.yml, messages.yml et borderdata.yml.
    default: false
  shinviworldborder.admin.info:
    description: Voir la bordure réelle de chaque monde.
    default: false
